version: "3.8"
services:
  strix:
    build:
      context: .
      dockerfile: Dockerfile.strix
    environment:
      - STRIX_LLM=vercel_ai_gateway/zai/glm-5.3
      - LLM_API_KEY=${LLM_API_KEY}
    volumes:
      - .:/app
  artemis:
    build:
      context: .
      dockerfile: Dockerfile.artemis
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - .:/app
    devices:
      - /dev/bus/usb:/dev/bus/usb